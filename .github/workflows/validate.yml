name: Validate

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TALENTA_EMAIL: ${{ secrets.TALENTA_EMAIL }}
      TALENTA_PASSWORD: ${{ secrets.TALENTA_PASSWORD }}
      HEADLESS: "true"
      TZ: Asia/Jakarta
      # Hardcoded to Monday/Friday alternate (home) location — not actually
      # clocking in, so geo is informational; kept for parity with prod runs.
      GEO_LAT: "-6.209077123779666"
      GEO_LNG: "106.63438083176038"
      GEO_LABEL: "Home (Mon/Fri)"

    steps:
      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Route traffic through exit node
        env:
          TS_EXIT_NODES: ${{ secrets.TS_EXIT_NODE }}
        run: |
          IFS=',' read -ra NODES <<< "$TS_EXIT_NODES"
          echo "Found ${#NODES[@]} exit node(s) to try"

          for i in "${!NODES[@]}"; do
            NODE="${NODES[$i]// /}"
            NODE_NUM=$((i + 1))
            echo ""
            echo "========================================="
            echo "Exit node ${NODE_NUM}/${#NODES[@]}: ${NODE:0:8}***"
            echo "========================================="

            for attempt in 1 2 3; do
              echo "--- Attempt ${attempt}/3 for node ${NODE_NUM} ---"
              sudo -E tailscale set --exit-node="$NODE" --accept-routes
              sleep 8

              COUNTRY=$(curl -s --max-time 15 https://ipinfo.io/json | jq -r '.country // empty')
              echo "Detected country: '${COUNTRY}'"

              if [ "$COUNTRY" = "ID" ]; then
                echo "✅ Exit node active — traffic routed through Indonesia"
                curl -s https://ipinfo.io/json | jq '{ip, city, region, country}'
                exit 0
              fi

              echo "⚠️ Country is '${COUNTRY}', expected 'ID'."
              sudo -E tailscale set --exit-node= 2>/dev/null || true
              sleep 3
            done

            echo "❌ Node ${NODE_NUM} failed after 3 attempts, moving to next..."
          done

          echo ""
          echo "❌ All ${#NODES[@]} exit node(s) failed. Dumping diagnostics:"
          sudo tailscale status || true
          exit 1

      - name: Run validate
        id: run
        run: pnpm run validate

      - name: Upload error screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-screenshot-validate-${{ github.run_number }}
          path: error-*.png
          retention-days: 3
          if-no-files-found: ignore

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          START_TIME: ${{ steps.timer.outputs.start }}
          SCHEDULE_TYPE: ${{ steps.run.outputs.schedule_type }}
          SCHEDULE_TEXT: ${{ steps.run.outputs.schedule_text }}
          LOGIN_OK: ${{ steps.run.outputs.login_ok }}
          URL_OK: ${{ steps.run.outputs.url_ok }}
          CLOCK_IN_VISIBLE: ${{ steps.run.outputs.clock_in_visible }}
          CLOCK_OUT_VISIBLE: ${{ steps.run.outputs.clock_out_visible }}
          LOGOUT_OK: ${{ steps.run.outputs.logout_ok }}
          ERROR_MSG: ${{ steps.run.outputs.error }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="✅"; LABEL="Passed"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            EMOJI="⚠️"; LABEL="Cancelled"
          else
            EMOJI="❌"; LABEL="Failed"
          fi

          ELAPSED=$(( $(date +%s) - START_TIME ))
          DURATION="$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s"

          COMMIT_FIRST=$(echo "$COMMIT_MSG" | head -1)
          SHORT_SHA=${COMMIT_SHA:0:7}

          fmt_bool() { [ "$1" = "true" ] && echo "✅" || echo "❌"; }
          fmt_visible() { [ "$1" = "true" ] && echo "visible" || echo "hidden"; }

          NL=$'\n'
          MSG="${EMOJI} <b>Validation ${LABEL}</b>${NL}"
          MSG+="─────────────────${NL}"
          MSG+="📦 <code>${SHORT_SHA}</code> ${COMMIT_FIRST}${NL}"
          MSG+="${NL}"
          MSG+="<b>Steps:</b>${NL}"
          MSG+="• Login: $(fmt_bool "$LOGIN_OK")${NL}"
          MSG+="• URL /live-attendance: $(fmt_bool "$URL_OK")${NL}"
          if [ -n "$SCHEDULE_TYPE" ] && [ "$SCHEDULE_TYPE" != "null" ]; then
            MSG+="• Schedule: ${SCHEDULE_TYPE} (${SCHEDULE_TEXT})${NL}"
          else
            MSG+="• Schedule: <i>none — holiday/day off</i>${NL}"
          fi
          MSG+="• Clock In btn: $(fmt_visible "$CLOCK_IN_VISIBLE")${NL}"
          MSG+="• Clock Out btn: $(fmt_visible "$CLOCK_OUT_VISIBLE")${NL}"
          MSG+="• Logout: $(fmt_bool "$LOGOUT_OK")${NL}"
          MSG+="${NL}"
          MSG+="📍 Geo: ${GEO_LABEL}${NL}"
          MSG+="⏱ Duration: ${DURATION}${NL}"
          MSG+="🔢 Run #${RUN_NUMBER}${NL}"

          if [ -n "$ERROR_MSG" ] && [ "$ERROR_MSG" != "null" ]; then
            MSG+="${NL}<b>Error:</b> <code>${ERROR_MSG}</code>${NL}"
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "reply_markup={\"inline_keyboard\":[[{\"text\":\"📋 View Run\",\"url\":\"${RUN_URL}\"}]]}"
