name: Clock In

on:
  workflow_dispatch:
    inputs:
      retry_count:
        description: "Current retry attempt (0 = first run)"
        required: false
        default: "0"

permissions:
  actions: write
  contents: read

jobs:
  check-enabled:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check CRON_ENABLED
        id: check
        run: |
          if [ "${{ vars.CRON_ENABLED }}" = "false" ]; then
            echo "⏸️ CRON_ENABLED is false — skipping clock in (cuti/disabled)."
            echo "enabled=false" >> $GITHUB_OUTPUT
          else
            echo "✅ CRON_ENABLED is active, proceeding..."
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify Telegram (skipped)
        if: steps.check.outputs.enabled == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          MSG="⏸️ <b>Clock In Skipped</b>%0A"
          MSG+="─────────────────%0A"
          MSG+="CRON_ENABLED is <b>false</b>%0A"
          MSG+="Set to <b>true</b> in repo variables to resume."

          BUTTONS='{"inline_keyboard":[[{"text":"📋 View Run","url":"'"${RUN_URL}"'"},{"text":"⚙️ Repo Settings","url":"'"${{ github.server_url }}/${{ github.repository }}/settings/variables/actions"'"}]]}'

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "reply_markup=${BUTTONS}"

  clock-in:
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TALENTA_EMAIL: ${{ secrets.TALENTA_EMAIL }}
      TALENTA_PASSWORD: ${{ secrets.TALENTA_PASSWORD }}
      HEADLESS: "true"
      TZ: Asia/Jakarta

    steps:
      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium browser
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: |
          for attempt in 1 2 3; do
            echo "=== Chromium install attempt ${attempt}/3 ==="
            if timeout 180 pnpm exec playwright install chromium; then
              echo "✅ Chromium ready"
              exit 0
            fi
            echo "⚠️ Attempt ${attempt} stalled or failed — retrying with a fresh connection..."
            sleep 5
          done
          echo "❌ Chromium install failed after 3 attempts"
          exit 1

      - name: Random delay
        run: |
          # Window: 60–1200s (1–20 minutes) for human-like variance
          DELAY=$((RANDOM % 1141 + 60))
          echo "Waiting ${DELAY}s (~$((DELAY / 60))m) before clock in..."
          sleep $DELAY

      - name: Determine geolocation
        id: geo
        run: |
          DOW=$(date -u +%u)
          if [ "$DOW" = "1" ] || [ "$DOW" = "5" ]; then
            echo "Monday/Friday — using alternate location"
            echo "lat=-6.209077123779666" >> $GITHUB_OUTPUT
            echo "lng=106.63438083176038" >> $GITHUB_OUTPUT
            echo "label=Home (Mon/Fri)" >> $GITHUB_OUTPUT
          else
            echo "Tue-Thu — using default location"
            echo "lat=-6.1993335" >> $GITHUB_OUTPUT
            echo "lng=106.7623687" >> $GITHUB_OUTPUT
            echo "label=Default Office (Tue-Thu)" >> $GITHUB_OUTPUT
          fi

      - name: Record clock time
        id: clock
        run: echo "time=$(date +'%d/%m/%Y %H:%M')" >> $GITHUB_OUTPUT

      - name: Run clock-in
        id: run
        run: |
          set +e
          pnpm run clock-in
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -eq 2 ]; then
            echo "schedule_skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "schedule_skipped=false" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        env:
          GEO_LAT: ${{ steps.geo.outputs.lat }}
          GEO_LNG: ${{ steps.geo.outputs.lng }}

      - name: Notify Telegram (schedule not found)
        if: steps.run.outputs.schedule_skipped == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          TODAY=$(date +'%A, %d %B %Y')
          NL=$'\n'
          MSG="⚠️ <b>Schedule Not Detected</b>${NL}"
          MSG+="─────────────────${NL}"
          MSG+="📅 ${TODAY}${NL}"
          MSG+="❌ Tidak ditemukan tipe schedule (O/H) di halaman Live Attendance.${NL}${NL}"
          MSG+="Kemungkinan: holiday, day off, atau perubahan layout.${NL}"
          MSG+="Clock In di-skip untuk hari ini."

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "reply_markup={\"inline_keyboard\":[[{\"text\":\"📋 View Run\",\"url\":\"${RUN_URL}\"}]]}"

      - name: Upload error screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-screenshot-clock-in-${{ github.run_number }}
          path: error-*.png
          retention-days: 3

      - name: Notify Telegram
        if: always() && steps.run.outputs.schedule_skipped != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEO_LABEL: ${{ steps.geo.outputs.label }}
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
          CLOCK_TIME: ${{ steps.clock.outputs.time }}
          START_TIME: ${{ steps.timer.outputs.start }}
          RETRY_COUNT: ${{ github.event.inputs.retry_count || '0' }}
          MAX_RETRY: "2"
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="✅"; LABEL="Successful"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            EMOJI="⚠️"; LABEL="Cancelled"
          else
            EMOJI="❌"; LABEL="Failed!"
          fi

          ELAPSED=$(( $(date +%s) - START_TIME ))
          DURATION="$(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s"

          FAILURE_NOTE=""
          if [ "$JOB_STATUS" = "failure" ]; then
            CURRENT_RETRY=$((RETRY_COUNT))
            HOUR=$(date +%H)
            MINUTE=$(date +%M)
            TIME_NUM=$(( HOUR * 60 + MINUTE ))
            if [ "$CURRENT_RETRY" -lt "$MAX_RETRY" ] && [ "$TIME_NUM" -lt 690 ]; then
              NEXT=$((CURRENT_RETRY + 1))
              FAILURE_NOTE="🔄 <b>Auto-retry ${NEXT}/${MAX_RETRY} starting now...</b>"
            else
              FAILURE_NOTE="⚠️ <b>Action Required:</b> Max retries reached or outside time window. Check error screenshot in artifacts."
            fi
          fi

          NL=$'\n'
          MSG="${EMOJI} <b>Clock In ${LABEL}</b>${NL}"
          MSG+="─────────────────${NL}"
          MSG+="📋 <b>Details:</b>${NL}"
          MSG+="• Workflow: Clock In${NL}"
          MSG+="• Status: ${JOB_STATUS}${NL}"
          MSG+="• Date: ${CLOCK_TIME} WIB${NL}"
          MSG+="• Run: #${RUN_NUMBER} (Attempt #${RUN_ATTEMPT})${NL}"
          MSG+="• Retry: ${RETRY_COUNT}/${MAX_RETRY}${NL}"
          MSG+="${NL}"
          MSG+="📍 Location: ${GEO_LABEL}${NL}"
          MSG+="⏱ Duration: ${DURATION}${NL}"
          if [ -n "$FAILURE_NOTE" ]; then
            MSG+="${NL}${FAILURE_NOTE}${NL}"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "reply_markup={\"inline_keyboard\":[[{\"text\":\"📋 View Run\",\"url\":\"${RUN_URL}\"}]]}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Telegram notification failed (HTTP ${HTTP_CODE}): ${BODY}"
          else
            echo "Telegram notification sent successfully"
          fi

      - name: Auto-retry on failure
        if: failure()
        env:
          RETRY_COUNT: ${{ github.event.inputs.retry_count || '0' }}
          MAX_RETRY: "2"
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_RETRY=$((RETRY_COUNT))

          if [ "$CURRENT_RETRY" -ge "$MAX_RETRY" ]; then
            echo "❌ Max retries reached (${CURRENT_RETRY}/${MAX_RETRY}). Giving up."
            exit 0
          fi

          # Clock In window: before 11:30 WIB (buffer from 12:00 limit)
          HOUR=$(date +%H)
          MINUTE=$(date +%M)
          TIME_NUM=$(( HOUR * 60 + MINUTE ))
          CUTOFF=$(( 11 * 60 + 30 ))

          if [ "$TIME_NUM" -ge "$CUTOFF" ]; then
            echo "❌ Outside time window (current: ${HOUR}:${MINUTE}, cutoff: 11:30). Too late to retry."
            exit 0
          fi

          NEXT_RETRY=$((CURRENT_RETRY + 1))
          echo "🔄 Triggering retry #${NEXT_RETRY}..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/clock-in.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"retry_count\":\"${NEXT_RETRY}\"}}")

          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Retry #${NEXT_RETRY} triggered successfully"
          else
            echo "::error::Failed to trigger retry (HTTP ${HTTP_CODE}). Manual re-run required."
            exit 1
          fi
